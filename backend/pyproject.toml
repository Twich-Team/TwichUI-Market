[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "twichui-market"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.1", "uvicorn==0.38.0", "SQLAlchemy==2.0.44",
  "alembic==1.17.1", "psycopg[binary]==3.2.12", "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["market*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
