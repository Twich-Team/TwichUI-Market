[global]
    workgroup = WORKGROUP
    server role = standalone server
    server min protocol = SMB2_02
    server max protocol = SMB3
    server signing = mandatory
    smb encrypt = desired
    disable netbios = yes
    smb ports = 445 1445
    map to guest = Never
    security = user
    passdb backend = tdbsam:/samba/passdb.tdb
    private dir = /samba
    lock directory = /samba
    state directory = /samba
    cache directory = /samba
    pid directory = /samba
    log level = 0
    load printers = no
    printing = bsd
    printcap name = /dev/null
    unix extensions = no
[backups]
    smb encrypt = required
    path = /share
    read only = no
    valid users = nas
    follow symlinks = no
    wide links = no

[signed]
    path = /share
    smb encrypt = desired
    read only = no
    valid users = nas
    follow symlinks = no
[readonly]
    path = /share
    smb encrypt = required
    read only = yes
    valid users = nas
    follow symlinks = no
