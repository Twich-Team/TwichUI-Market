# Isolated disposable database, never apply this overlay to the development stack.
services:
  monitor:
    profiles: [disabled-in-tests]
  db:
    environment:
      POSTGRES_DB: market_test
    volumes: !override []
    # Repeated schema/concurrency tests generate WAL, not market history. Keep a
    # bounded test-only allowance and checkpoint before the disposable disk fills.
    tmpfs: [/var/lib/postgresql/data:size=512m]
    command: [postgres, -c, max_wal_size=64MB, -c, min_wal_size=32MB, -c, checkpoint_timeout=30s]
    healthcheck:
      test: [CMD, pg_isready, -U, market, -d, market_test]
  test:
    image: twichui-market-backend:dev
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/market_test
    depends_on: {db: {condition: service_healthy}}
    command: [pytest, -q, -p, no:cacheprovider]
    mem_limit: 384m
    cpus: 1
