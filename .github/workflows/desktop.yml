name: Windows companion
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop -> target
            desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace --locked
      - run: cargo build --manifest-path desktop/Cargo.toml --example http_smoke --locked
      - run: pip install -r backend/requirements.lock
      - run: python scripts/verify-companion-http.py
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop run tauri build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: twichui-market-companion-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
