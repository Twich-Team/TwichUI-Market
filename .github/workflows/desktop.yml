name: Windows companion
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            desktop -> target
            desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify combined PR source
        run: python scripts/verify-ci-checkout.py
        env:
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Checkout paired addon source (source-only acceptance)
        uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI
          ref: 074435e41521e97ad125e3094c45a9eb767f90e1
          path: coordinated-addon
          persist-credentials: false
      - name: Checkout merged split-projection addon source
        uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI
          ref: d93d253ac31b89e953a8853ee2ce7b25adaedcc7
          path: coordinated-current-addon
          persist-credentials: false
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace --locked
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: cargo build --manifest-path desktop/Cargo.toml --example http_smoke --locked
      - run: cargo build --manifest-path desktop/Cargo.toml --example authorization_smoke --locked
      - run: cargo build --manifest-path desktop/Cargo.toml --example archive_smoke --locked
      - run: cargo build --manifest-path desktop/Cargo.toml --example workshop_smoke --locked
      - run: pip install -r backend/requirements.lock
      - run: python scripts/verify-companion-http.py
      - run: python scripts/verify-companion-authorization.py
      - name: Verify authenticated native archive and scoped manual publisher
        run: python scripts/verify-archive-e2e.py --rust-client desktop/target/debug/examples/archive_smoke.exe --skip-lua --report artifacts/companion-v2/archive-e2e.json
      - name: Verify explicitly provisional archive compatibility
        run: python scripts/verify-archive-e2e.py --rust-client desktop/target/debug/examples/archive_smoke.exe --algorithm asking-v1-provisional --skip-lua --report artifacts/companion-v2/archive-provisional-e2e.json
      - run: npm ci --prefix desktop
      - run: npm --prefix desktop run tauri build -- --ci
        id: bundle
      - run: npm ci --prefix web
      - run: npm --prefix web run build
      - name: Verify actual legacy installer upgrade
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/windows/verify-upgrade.ps1
      - name: Verify installed Windows release
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/windows/verify-installer.ps1
      - name: Actual authenticated large-market native summary publication
        timeout-minutes: 10
        run: python scripts/verify-workshop-e2e.py --rust-client desktop/target/debug/examples/workshop_smoke.exe --addon-root coordinated-addon --variants 45125 --publish --skip-lua --out artifacts/companion-v2/workshop-large
      - name: Actual authenticated split-projection native publication
        timeout-minutes: 5
        run: python scripts/verify-workshop-e2e.py --rust-client desktop/target/debug/examples/workshop_smoke.exe --addon-root coordinated-current-addon --current --variants 129 --publish --skip-lua --out artifacts/companion-v2/workshop-current
      - name: Record Windows publisher status and embedded updater key
        shell: pwsh
        run: ./scripts/windows/record-private-beta-candidate.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-v2-acceptance
          path: artifacts/companion-v2/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          name: twichui-market-companion-windows-candidate
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error


  picker:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI
          ref: 074435e41521e97ad125e3094c45a9eb767f90e1
          path: coordinated-addon
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - run: cargo build --manifest-path desktop/Cargo.toml --example installation_smoke --locked
        id: installation_build
      - name: Verify inherited NTFS permissions with a non-elevated token
        shell: pwsh
        run: ./scripts/windows/verify-workshop-permissions.ps1
      - shell: pwsh
        if: ${{ !cancelled() && steps.installation_build.outcome == 'success' }}
        run: ./scripts/windows/verify-workshop-picker.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-permissions-acceptance
          path: artifacts/companion-v2/workshop-permissions.json
          if-no-files-found: ignore

  signed-update:
    uses: ./.github/workflows/companion-release.yml
    with:
      harness_commit: ${{ github.event.pull_request.head.sha || github.sha }}
      proof_path: docs/evidence/companion-v2-signed-candidate.json
      # Integration must recheck the original signed bytes against its real API.
      pending_only: ${{ !startsWith(github.ref, 'refs/heads/integration/') }}

  workshop-consumer:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI
          ref: 074435e41521e97ad125e3094c45a9eb767f90e1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: companion-v2-acceptance
          path: acceptance
      - name: Checkout exact split-projection consumer
        uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI
          ref: d93d253ac31b89e953a8853ee2ce7b25adaedcc7
          path: current-consumer
          persist-credentials: false
      - name: Lua 5.1 and bitop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-bitop
      - name: Actual Windows publication through production Lua and Workshop Market
        working-directory: tests
        env:
          WORKSHOP_SUMMARY_ARTIFACT: ${{ github.workspace }}/acceptance/workshop-installed/publication/TwichUI_MarketData/Data.lua
          WORKSHOP_SUMMARY_PARTS: ${{ github.workspace }}/acceptance/workshop-installed/publication
          WORKSHOP_SUMMARY_EXPECTED_ITEM: '12363'
          WORKSHOP_SUMMARY_EXPECTED_RECENT: '100'
          # This fixture has one genuinely priced day. Canonical market value
          # is 100; only historical value needs three priced daily closes.
          WORKSHOP_SUMMARY_EXPECTED_MARKET: '100'
        run: lua5.1 -e 'require("bit"); ROOT="../!!!TwichUI/"; REPO="../"; TESTS="./"' test_workshop_auction_market_summary.lua
      - name: Actual large Windows publication through production Lua and Workshop Market
        working-directory: tests
        env:
          WORKSHOP_SUMMARY_ARTIFACT: ${{ github.workspace }}/acceptance/workshop-large/publication/TwichUI_MarketData/Data.lua
          WORKSHOP_SUMMARY_PARTS: ${{ github.workspace }}/acceptance/workshop-large/publication
          WORKSHOP_SUMMARY_EXPECTED_ITEM: '10000'
        run: lua5.1 -e 'require("bit"); ROOT="../!!!TwichUI/"; REPO="../"; TESTS="./"' test_workshop_auction_market_summary.lua
      - name: Measure source-qualified large-publication Lua costs
        working-directory: tests
        env:
          WORKSHOP_SUMMARY_ARTIFACT: ${{ github.workspace }}/acceptance/workshop-large/publication/TwichUI_MarketData/Data.lua
          WORKSHOP_SUMMARY_PARTS: ${{ github.workspace }}/acceptance/workshop-large/publication
          WORKSHOP_SUMMARY_EXPECTED_ITEM: '10000'
        run: lua5.1 -e 'require("bit"); ROOT="../!!!TwichUI/"; REPO="../"; TESTS="./"' bench_workshop_summary.lua | tee ../acceptance/workshop-large/production-lua-costs.json
      - name: Windows split publication through exact production Lua consumer
        working-directory: current-consumer
        env:
          WORKSHOP_SUMMARY_ARTIFACT: ${{ github.workspace }}/acceptance/workshop-current/publication/TwichUI_MarketData/Data.lua
          WORKSHOP_SUMMARY_PARTS: ${{ github.workspace }}/acceptance/workshop-current/publication
          WORKSHOP_SUMMARY_EXPECTED_ITEM: '10000'
        run: lua5.1 -e 'REPO="./"; dofile("tests/bench_workshop_summary.lua"); assert(TwichUI.Workshop.Bridge.Manifest().contract_version==3)'
      - name: Legacy Windows contract-2 publication through merged addon
        working-directory: current-consumer
        env:
          WORKSHOP_SUMMARY_ARTIFACT: ${{ github.workspace }}/acceptance/workshop-large/publication/TwichUI_MarketData/Data.lua
          WORKSHOP_SUMMARY_PARTS: ${{ github.workspace }}/acceptance/workshop-large/publication
          WORKSHOP_SUMMARY_EXPECTED_ITEM: '10000'
        run: lua5.1 -e 'REPO="./"; dofile("tests/bench_workshop_summary.lua"); assert(TwichUI.Workshop.Bridge.Manifest().contract_version==2)'
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-production-lua-acceptance
          path: acceptance/workshop-large/

  prepared-publisher:
    # Independent of the installed UI campaign: a UI failure must not silently
    # skip the new wire-format producer/consumer acceptance.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI
          ref: 5a30881052c5fe2118b00def6c5339115451c2e2
          path: prepared-addon
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: cargo build --manifest-path desktop/Cargo.toml --example workshop_smoke --locked
      - name: Freeze the shared synthetic source instant for both layouts
        shell: pwsh
        run: |
          "WORKSHOP_FIXTURE_AS_OF=$([DateTime]::UtcNow.AddMinutes(-1).ToString('o'))" >> $env:GITHUB_ENV
      - name: Build isolated offline acceptance helper without changing normal native flags
        run: cargo build --manifest-path desktop/Cargo.toml --example prepared_private_publish --features private-dev --locked
      - name: Actual native prepared 16 publication (60 synthetic days)
        run: python scripts/verify-workshop-e2e.py --rust-client desktop/target/debug/examples/workshop_smoke.exe --addon-root prepared-addon --current --prepared 16 --fixture-as-of "$env:WORKSHOP_FIXTURE_AS_OF" --private-publisher desktop/target/debug/examples/prepared_private_publish.exe --variants 129 --days 60 --publish --skip-lua --out artifacts/prepared/16
      - name: Actual native prepared 32 publication (60 synthetic days)
        run: python scripts/verify-workshop-e2e.py --rust-client desktop/target/debug/examples/workshop_smoke.exe --addon-root prepared-addon --current --prepared 32 --fixture-as-of "$env:WORKSHOP_FIXTURE_AS_OF" --private-publisher desktop/target/debug/examples/prepared_private_publish.exe --variants 129 --days 60 --publish --skip-lua --out artifacts/prepared/32
      - name: Actual native 25-container publication (same 60-day source)
        run: python scripts/verify-workshop-e2e.py --rust-client desktop/target/debug/examples/workshop_smoke.exe --addon-root prepared-addon --current --prepared 32 --containers --fixture-as-of "$env:WORKSHOP_FIXTURE_AS_OF" --private-publisher desktop/target/debug/examples/prepared_private_publish.exe --variants 129 --days 60 --publish --skip-lua --out artifacts/prepared/25
      - name: Require identical 16-baseline and 25-container prices and all histories
        run: python scripts/verify-prepared-layout-pair.py artifacts/prepared/16/publication artifacts/prepared/25/publication > artifacts/prepared/container-pair.json
      - name: Require identical source generation, prices and all 64 histories
        run: python scripts/verify-prepared-layout-pair.py artifacts/prepared/16/publication artifacts/prepared/32/publication > artifacts/prepared/layout-pair.json
      - name: Checkout exact old Companion source for compatibility
        uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI-Market
          ref: e2882dd822b356ffa081efebbff167827f9bf364
          path: legacy-market
          persist-credentials: false
      - name: Old Companion with prepared-capable addon must stay on Contract 3 legacy files
        shell: pwsh
        run: |
          cargo build --manifest-path legacy-market/desktop/Cargo.toml --target-dir desktop/target --example workshop_smoke --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-workshop-e2e.py --rust-client desktop/target/debug/examples/workshop_smoke.exe --addon-root prepared-addon --current --legacy-native --legacy-native-source-root legacy-market --variants 129 --days 60 --publish --skip-lua --out artifacts/prepared/legacy-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-native-publication
          path: artifacts/prepared
          if-no-files-found: error

  prepared-consumer:
    needs: prepared-publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: Twich-Team/TwichUI
          ref: 5a30881052c5fe2118b00def6c5339115451c2e2
          path: prepared-addon
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared-native-publication
          path: prepared-publication
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua-bitop
      - name: Build offline system-codec adapter (not Forever timing)
        run: cc -shared -fPIC -O2 scripts/codec_zlib_offline.c -lz -lcrypto -o "$RUNNER_TEMP/market-codec.so"
      - name: Exact Windows files through production Lua and Opportunities
        working-directory: prepared-addon/tests
        shell: bash
        run: |
          export WORKSHOP_CODEC_NATIVE="$RUNNER_TEMP/market-codec.so"
          for fixture in 16 32 25 legacy-native; do
            layout="$fixture"; if [ "$fixture" = legacy-native ]; then layout=0; elif [ "$fixture" = 25 ]; then layout=32; fi
            export WORKSHOP_SUMMARY_ARTIFACT="$GITHUB_WORKSPACE/prepared-publication/$fixture/publication/TwichUI_MarketData/Data.lua"
            export WORKSHOP_SUMMARY_PARTS="$GITHUB_WORKSPACE/prepared-publication/$fixture/publication"
            export WORKSHOP_PREPARED_EXPECTED_LAYOUT="$layout"
            lua5.1 -e 'require("bit"); ROOT="../!!!TwichUI/"; REPO="../"; TESTS="./"' "$GITHUB_WORKSPACE/scripts/test_workshop_prepared_artifact.lua"
          done
