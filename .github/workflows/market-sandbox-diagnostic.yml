name: Bounded Market simulator sandbox diagnostic
on:
  push:
    branches: [diagnostic/market-simulator-sandbox]
permissions:
  contents: read
jobs:
  actual-bubblewrap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Observe the existing sandbox command without changing security
        shell: bash
        run: |
          echo "runner=${{ matrix.runner }}"
          for entry in /proc/self/attr/current /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone; do
            if [ -r "$entry" ]; then echo "$entry"; cat "$entry"; fi
          done
          awk '/^(Uid|Cap|Seccomp|NoNewPrivs)/' /proc/self/status
          unshare -U sh -c 'cat /proc/self/attr/current' || true
          deps="$RUNNER_TEMP/market-sandbox-diagnostic"
          mkdir -p "$deps/downloads" "$deps/root"
          cd "$deps/downloads"
          apt-get download bubblewrap
          for deb in ./*.deb; do dpkg-deb -x "$deb" "$deps/root"; done
          "$deps/root/usr/bin/bwrap" --version
          ls -ld /mnt
          if [ -d /mnt/c ]; then echo 'Existing /mnt/c is present'; else echo 'No /mnt/c on this runner'; fi
          set +e
          "$deps/root/usr/bin/bwrap" --ro-bind / / --dev /dev --proc /proc \
            --tmpfs /tmp --tmpfs "$HOME" --tmpfs /mnt/c --unshare-all \
            --die-with-parent --new-session --clearenv --setenv PATH /usr/bin:/bin \
            -- /usr/bin/true > "$deps/actual-sandbox.log" 2>&1
          result=$?
          cat "$deps/actual-sandbox.log"
          printf 'actual_sandbox_exit=%s\n' "$result" >> "$deps/actual-sandbox.log"
          exit "$result"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-market-sandbox-diagnostic-${{ matrix.runner }}
          path: ${{ runner.temp }}/market-sandbox-diagnostic/actual-sandbox.log
          retention-days: 14
