name: Companion private DEV build
on:
  workflow_dispatch:
    inputs:
      source:
        description: Branch or full reviewed commit to build (blank uses selected branch)
        required: false
        default: ''
  # This opt-in branch namespace works before the workflow is merged to main.
  # Push a checkpoint here for the next owner iteration; no release pipeline dependency.
  push:
    branches: ['dev/companion/**', 'fix/workshop-validator-dev-build', 'feature/companion-sync-performance']
permissions:
  contents: read
concurrency:
  group: companion-dev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-dev:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Record exact source and build identity
        shell: pwsh
        run: |
          $sha=(git rev-parse HEAD).Trim()
          "COMPANION_DEV_SHA=$sha" >> $env:GITHUB_ENV
          "DEV_ARTIFACT=TwichUI-Market-Companion-DEV-$($sha.Substring(0,7))" >> $env:GITHUB_ENV
          New-Item artifacts/companion-dev -ItemType Directory -Force | Out-Null
          @{source_commit=$sha;run_id='${{ github.run_id }}';run_attempt='${{ github.run_attempt }}';unsigned=$true;private_test=$true;application_id='team.twich.market.dev';updates_enabled=$false} | ConvertTo-Json | Set-Content artifacts/companion-dev/build.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: companion-dev-native-v2
          cache-on-failure: false
          # Seed only after packaging succeeds; a core-only failed run must not
          # freeze an incomplete native dependency cache for every iteration.
          workspaces: |
            desktop -> target
            desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Focused validator and diagnostics checks
        run: |
          cargo test --manifest-path desktop/Cargo.toml --locked --lib performance::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --lib missing_workshop_service_is_distinct
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --lib workshop_setup::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --lib installation::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --lib windows_owner::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --test bridge windows_junction_and_broad_write_acl_are_refused
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --lib shared_game_permissions_keep_account_markers_and_unknown_files_enforced
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --lib workshop_setup::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/Cargo.toml --locked --lib --features private-dev vault::dev_tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare isolated unsigned development application
        run: python scripts/prepare-companion-dev.py
      - run: npm ci --prefix desktop
      - name: Package actual Tauri frontend and native backend
        run: npm --prefix desktop run tauri build -- --ci --features private-dev --config src-tauri/tauri.dev.conf.json
      - name: Minimal installed Windows smoke
        timeout-minutes: 3
        run: ./scripts/windows/verify-companion-dev.ps1
      - name: Package the private offline native acceptance tool and endpoint adapter
        shell: pwsh
        run: |
          cargo build --manifest-path desktop/Cargo.toml --release --locked --features private-dev --example prepared_private_publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/target/release/examples/prepared_private_publish.exe artifacts/companion-dev/
          Copy-Item scripts/verify-prepared-layout-pair.py artifacts/companion-dev/
          Copy-Item scripts/prepare-private-current-snapshot.py artifacts/companion-dev/
          Copy-Item scripts/select-private-current-layout.ps1 artifacts/companion-dev/
          Copy-Item docs/private-prepared-native-acceptance.md artifacts/companion-dev/
          Get-ChildItem artifacts/companion-dev -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content artifacts/companion-dev/PRIVATE-TOOLS-SHA256SUMS.txt
      - name: Freeze executable integrity and owner instructions
        shell: pwsh
        run: |
          $installer=@(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if($installer.Count -ne 1){throw 'Expected one installer'}
          $destination="artifacts/companion-dev/$env:DEV_ARTIFACT-setup.exe"
          Copy-Item $installer[0].FullName $destination
          $hash=(Get-FileHash $destination -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:DEV_ARTIFACT-setup.exe" | Set-Content artifacts/companion-dev/SHA256SUMS.txt
          @"
          UNSIGNED PRIVATE WINDOWS TEST — $env:DEV_ARTIFACT
          Source: $env:COMPANION_DEV_SHA
          1. Verify checksums and use only a disposable Windows VM with an independent Forever installation and fresh private WTF. Do not mount production folders or install the normal Companion in that VM.
          2. Read private-prepared-native-acceptance.md for the pinned addon, device approval, frozen source, explicit 16/32 selection and native publication steps.
          3. DEV uses separate credentials/storage and cannot update itself. Confirm only the exact private game folder; fully exit DEV during offline publication and game trials.
          4. Keep snapshots, credentials and real Market data private. Report pair receipts and redacted performance exports; never upload real data as CI artifacts.
          No signing, production installation replacement, public endpoint deployment or updater publication occurred.
          "@ | Set-Content artifacts/companion-dev/READ-ME.txt
          "Artifact: $env:DEV_ARTIFACT`nSource: $env:COMPANION_DEV_SHA`nSHA256: $hash`nUnsigned side-by-side NSIS installer; focused checks and installed native/frontend smoke passed." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEV_ARTIFACT }}
          path: artifacts/companion-dev/
          if-no-files-found: error
          retention-days: 14
