name: Backend
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: market_test
          POSTGRES_USER: market
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market -d market_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://market:test-only@127.0.0.1:5432/market_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify combined PR source
        run: python ../scripts/verify-ci-checkout.py
        env:
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: pip install -r requirements.lock && pip install --no-deps .
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.lock --no-deps --disable-pip
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -q
      - run: python ../scripts/verify-metadata-migration.py
      - run: python ../scripts/verify-companion-migration.py
