# Standalone disposable verification; never combine with production Compose.
name: twichui-market-backup-test
services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: market_test, POSTGRES_USER: market, POSTGRES_PASSWORD: synthetic-backup-test-only}
    tmpfs: [/var/lib/postgresql/data:size=512m]
    command: [postgres, -c, max_wal_size=64MB, -c, min_wal_size=32MB, -c, checkpoint_timeout=30s]
    mem_limit: 512m
    cpus: 0.5
    logging: {driver: json-file, options: {max-size: "2m", max-file: "1"}}
    healthcheck:
      test: [CMD, pg_isready, -U, market, -d, market_test]
      interval: 2s
      timeout: 2s
      retries: 30
  test:
    image: twichui-market-backend:backup-review
    environment: {DATABASE_URL: 'postgresql+psycopg://market:synthetic-backup-test-only@db:5432/market_test'}
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 384m
    cpus: 1
    volumes: [./backend/market:/app/market:ro, ./backend/tests:/app/tests:ro, ./scripts:/scripts:ro, ./backend:/backend:ro]
    command: [pytest, -q, -p, no:cacheprovider]
  backup-check:
    build:
      context: ./deploy/backup
      dockerfile: Management.Dockerfile
    image: twichui-market-backup-manager:review
    environment: {PGHOST: db, PGUSER: market, PGDATABASE: market_test, PGPASSWORD: synthetic-backup-test-only, PGCONNECT_TIMEOUT: "10"}
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp:size=16m, /state:size=16m]
    volumes: [./artifacts/backup-management/fixtures:/backups, ./scripts:/checks:ro]
    entrypoint: [python3, /checks/verify-backup-management.py]
