# Browser integration project only; no host ports or persistent development data.
services:
  monitor:
    profiles: [disabled-in-tests]
  db:
    environment:
      POSTGRES_DB: market_test
    volumes: !override []
    tmpfs: [/var/lib/postgresql/data:size=256m]
  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/market_test
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/market_test
      APP_ORIGIN: http://proxy
      COOKIE_SECURE: "false"
      METADATA_KEYRING_FILE: /tmp/metadata-browser-keyring.json
      SYNC_CURSOR_SECRET: synthetic-browser-signing-key-not-for-deployment
      COMPANION_PRIVATE_BETA_DIRECTORY: /tmp/companion-private-beta-fixtures/incoming-2.0.0-beta.1
      COMPANION_PRIVATE_BETA_USER_IDS: "10001"
    volumes: !override []
  proxy:
    ports: !override []
