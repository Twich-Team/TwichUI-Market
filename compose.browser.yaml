# Browser integration project only; no host ports or persistent development data.
services:
  monitor:
    profiles: [disabled-in-tests]
  db:
    environment:
      POSTGRES_DB: market_test
    # The collector fixture must measure the actual PostgreSQL filesystem.
    # This project-only volume is removed by the existing CI cleanup.
    volumes: !override [market-data:/var/lib/postgresql/data]
    command: [postgres, -c, max_wal_size=64MB, -c, min_wal_size=32MB, -c, checkpoint_timeout=30s]
  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/market_test
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://market:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/market_test
      APP_ORIGIN: http://proxy
      MAX_DATABASE_BYTES: "268435456"
      COOKIE_SECURE: "false"
      METADATA_KEYRING_FILE: /tmp/metadata-browser-keyring.json
      SYNC_CURSOR_SECRET: synthetic-browser-signing-key-not-for-deployment
      COMPANION_PRIVATE_BETA_DIRECTORY: /tmp/companion-private-beta-fixtures/incoming-2.0.0-beta.1
      COMPANION_UPDATER_PUBLIC_KEY: synthetic-only-updater-public-key
    volumes: !override [market-data:/database-filesystem:ro]
  proxy:
    ports: !override []
