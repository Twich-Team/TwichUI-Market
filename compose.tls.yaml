# Local HTTPS without modifying host certificate trust, ports, firewall or proxies.
services:
  api:
    environment:
      APP_ORIGIN: https://localhost:18443
      COOKIE_SECURE: "true"
  proxy:
    ports: !override ["127.0.0.1:18443:443"]
    volumes: !override
      - ./deploy/Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - ./deploy/routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy-data:/data
volumes:
  caddy-data:
